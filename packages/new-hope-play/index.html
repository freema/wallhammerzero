<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Hope</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07040f; overflow: hidden; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; font: 600 13px/1.4 ui-monospace, Menlo, monospace; color: #e8f6ff; text-shadow: 0 0 6px #3aeeff88, 0 1px 0 #000; }
      #hud .tl { position: absolute; left: 16px; top: 14px; }
      #hud .tr { position: absolute; right: 16px; top: 14px; text-align: right; }
      #hud .bl { position: absolute; left: 16px; bottom: 14px; opacity: .8; }
      #hud .c { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 26px; letter-spacing: .12em; text-align: center; color: #ffe23a; text-shadow: 0 0 14px #ff3aa8; opacity: 0; transition: opacity .4s; }
      #hud .prompt { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); padding: 4px 10px; border: 1px solid #3aeeff88; background: #0a0618aa; opacity: 0; }
      #hud b { color: #ff3aa8; }
      #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(#1a0d33cc, #050208ee); color: #e8f6ff; font: 600 14px/1.6 ui-monospace, Menlo, monospace; cursor: pointer; text-align: center; }
      #start h1 { font-size: 54px; letter-spacing: .3em; margin: 0 0 4px; color: #ffe23a; text-shadow: 0 0 22px #ff3aa8; }
      #start p { margin: 4px; opacity: .85; }
    </style>
  </head>
  <body>
    <div id="hud"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="c"></div><div class="prompt"></div></div>
    <div id="start"><div><h1>NEW HOPE</h1><p>Andromeda · the abandoned city-world · the Union resettles it</p><p>&nbsp;</p><p>click to play</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
